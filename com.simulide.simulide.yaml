id: com.simulide.simulide
runtime: org.kde.Platform
runtime-version: "5.15-25.08"
sdk: org.kde.Sdk
command: simulide
rename-icon: "simulide"
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=home
modules:
  - name: simulide
    buildsystem: qmake
    subdir: build_XX
    sources:
      - type: git
        url: https://github.com/Arcachofo/SimuliDE-1
        commit: b169436c472515818fece8d9eb44b24814b20e75 
    post-install:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ ./executables/SimulIDE_1.1.0-SR2/simulide
      - install -d ${FLATPAK_DEST}/share/simulide/
      - cp -r ./executables/SimulIDE_1.1.0-SR2/data ${FLATPAK_DEST}/share/simulide
      - cp -r ./executables/SimulIDE_1.1.0-SR2/examples ${FLATPAK_DEST}/share/simulide
      - cp ../resources/qm/simulide_*.qm ${FLATPAK_DEST}/share/simulide/
      - install -Dm644 ../resources/icons/simulide.png -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/
      - install -D ../resources/simulide.desktop ${FLATPAK_DEST}/share/applications/com.simulide.simulide.desktop
      - install -D ../resources/com.simulide.simulide.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.simulide.simulide.metainfo.xml
